# Intégration continue : à chaque push et à chaque Pull Request vers main.
# Une étape en échec rend la CI rouge : la Pull Request ne doit pas être fusionnée.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Qualité, build et tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : Pint compare avec la branche main

      - name: PHP 8.4 et extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Dossier du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dépendances front-end
        run: npm ci --no-audit --no-fund

      - name: Configuration
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Qualité du code (Pint, fichiers modifiés par la Pull Request)
        if: github.event_name == 'pull_request'
        run: vendor/bin/pint --test --diff=origin/${{ github.base_ref }}

      - name: Build front-end (Vite)
        run: npm run build

      - name: Tests (PHPUnit, SQLite en mémoire)
        run: php artisan test

      - name: Sécurité des dépendances
        run: composer audit

  docker:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/wearagain
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image (publiée seulement depuis main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLIER == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
