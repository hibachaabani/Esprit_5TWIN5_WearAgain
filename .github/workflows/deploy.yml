# Déploiement continu : quand la CI de main est verte, Render redéploie l'application.
# Render construit l'image, vérifie la route /up, et garde l'ancienne version si la nouvelle échoue.
# Le lien de déploiement (Deploy Hook) se trouve dans Render > Settings ; il se range dans
# le secret GitHub RENDER_DEPLOY_HOOK_URL, jamais dans le code.
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  render:
    name: Déployer sur Render
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::Secret RENDER_DEPLOY_HOOK_URL absent : Render déploie seul s'il est relié au dépôt."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Déploiement demandé à Render pour le commit ${{ github.event.workflow_run.head_sha }}."
