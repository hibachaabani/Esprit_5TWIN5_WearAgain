; Réglages PHP de l'image de production.
; OPcache garde le code compilé en mémoire : les pages sont 5 à 6 fois plus rapides.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

upload_max_filesize=8M
post_max_size=10M
memory_limit=256M
expose_php=Off
